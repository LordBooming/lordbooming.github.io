name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A4654E: ${{ secrets.A4654E }}
          B8899F: ${{ secrets.B8899F }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A4654E', '')
          meta_b = os.environ.get('B8899F', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 590ff683e6f8f77ce2c4ae4a07e8030b1d152f5e9ec0b9 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 017d1f0b671e83bf7ff416c0fa022313 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
